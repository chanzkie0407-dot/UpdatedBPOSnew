<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — BPOS</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="admin-container">
    <div class="header">
      <h1>Admin Dashboard</h1>
      <button id="logout-btn" class="btn-logout">Log Out</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="cashiers">Cashier Accounts</button>
      <button class="tab-btn" data-tab="stores">Stores</button>
    </div>

    <div id="cashiers" class="tab-content active">
      <h2>Add Cashier</h2>
      <form id="cashier-form" class="form-card">
        <div class="form-row"><label>Full Name:</label><input type="text" id="cname" required></div>
        <div class="form-row"><label>Store ID:</label><input type="text" id="cstore" required placeholder="e.g. DVO01"></div>
        <div class="form-row"><label>Password:</label><input type="text" id="cpass" required placeholder="e.g. 1234"></div>
        <button type="submit" class="btn-primary">Add Cashier</button>
      </form>
      <h3>Cashier List</h3>
      <div id="cashier-list"></div>
    </div>

    <div id="stores" class="tab-content">
      <h2>Add Store</h2>
      <form id="store-form" class="form-card">
        <div class="form-row"><label>Store ID:</label><input type="text" id="sid" required></div>
        <div class="form-row"><label>Store Name:</label><input type="text" id="sname" required></div>
        <button type="submit" class="btn-primary">Add Store</button>
      </form>
      <h3>Store List</h3>
      <div id="store-list"></div>
    </div>
  </div>

<script type="module">
import { requireAuth } from '../../auth/protect.js';
import { logout } from '../../auth/login.js';

const user = requireAuth(['admin']);
if (!user) {}

document.getElementById('logout-btn').onclick = logout;

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  };
});

function loadCashiers() {
  const data = JSON.parse(localStorage.getItem('cashiers') || '[]');
  document.getElementById('cashier-list').innerHTML = data.length === 0
    ? '<p>No cashiers yet.</p>'
    : data.map((c, i) => `<div class="item-card"><span><strong>${c.name}</strong> — Store: ${c.storeId} | Pass: ${c.password}</span><button data-i="${i}" class="btn-delete">Delete</button></div>`).join('');
  document.querySelectorAll('#cashier-list .btn-delete').forEach(b => {
    b.onclick = () => {
      const all = JSON.parse(localStorage.getItem('cashiers') || '[]');
      all.splice(parseInt(b.dataset.i), 1);
      localStorage.setItem('cashiers', JSON.stringify(all));
      loadCashiers();
    };
  });
}

document.getElementById('cashier-form').onsubmit = e => {
  e.preventDefault();
  const all = JSON.parse(localStorage.getItem('cashiers') || '[]');
  all.push({ id: Date.now(), name: document.getElementById('cname').value.trim(), storeId: document.getElementById('cstore').value.trim(), password: document.getElementById('cpass').value.trim() });
  localStorage.setItem('cashiers', JSON.stringify(all));
  e.target.reset();
  loadCashiers();
};

function loadStores() {
  const data = JSON.parse(localStorage.getItem('stores') || '[]');
  document.getElementById('store-list').innerHTML = data.length === 0
    ? '<p>No stores yet.</p>'
    : data.map((s, i) => `<div class="item-card"><span><strong>${s.storeId}</strong> — ${s.name}</span><button data-i="${i}" class="btn-delete">Delete</button></div>`).join('');
  document.querySelectorAll('#store-list .btn-delete').forEach(b => {
    b.onclick = () => {
      const all = JSON.parse(localStorage.getItem('stores') || '[]');
      all.splice(parseInt(b.dataset.i), 1);
      localStorage.setItem('stores', JSON.stringify(all));
      loadStores();
    };
  });
}

document.getElementById('store-form').onsubmit = e => {
  e.preventDefault();
  const all = JSON.parse(localStorage.getItem('stores') || '[]');
  all.push({ storeId: document.getElementById('sid').value.trim(), name: document.getElementById('sname').value.trim() });
  localStorage.setItem('stores', JSON.stringify(all));
  e.target.reset();
  loadStores();
};

loadCashiers();
loadStores();
</script>
</body>
</html>
